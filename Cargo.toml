[package]
name = "mitm-transformation"
version = "0.19.0"
edition = "2021"
license = "Apache-2.0"
description = "MitM transformation-layer scheduled batch job"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
rand = "0.8"
